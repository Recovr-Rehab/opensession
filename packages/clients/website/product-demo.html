<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<script>
			/* The preview follows the visitor's system theme, the same signal the
			   page around it uses, so a dark landing page never frames a white
			   app. Set before the stylesheets so there is no flash. */
			(function () {
				var media = window.matchMedia("(prefers-color-scheme: dark)");
				var apply = function (dark) {
					document.documentElement.setAttribute(
						"data-theme",
						dark ? "dark" : "light",
					);
				};
				apply(media.matches);
				media.addEventListener("change", function (event) {
					apply(event.matches);
				});
			})();
		</script>
		<link rel="stylesheet" href="../../core/opensession-server/src/frontend/styles/base.css" />
		<link rel="stylesheet" href="../../core/opensession-server/src/frontend/styles/legacy.css" />
		<link rel="stylesheet" href="./.demo-tailwind.css" />
		<style>
			/* Overlay scrollbars, the way a Mac draws them. A track running down
			   the side of the one screenshot on the page is noise, and it is not
			   what the app looks like on the machine most visitors are on.

			   `html *` rather than `*`, because base.css sets `scrollbar-width:
			   thin` on the universal selector and the build emits the bundled
			   stylesheet AFTER this block: anything here that ties on
			   specificity loses. One element in the selector is enough to win
			   without reaching for !important. */
			html,
			html * {
				scrollbar-width: none;
			}

			/* For WebKit before Safari 18.2, which has no scrollbar-width. Hidden
			   rather than zero-width: a custom scrollbar with a width carves a
			   permanent gutter out of the Macs that draw overlays, while a hidden
			   one reserves nothing. */
			html ::-webkit-scrollbar {
				display: none;
			}

			/* The app's floating desktop notifications: the "Open in app" hand-off
			   and the update toast. Both are right in the product and wrong in a
			   screenshot of it. Matched on the stack rather than on either
			   toast's copy, which is the part that keeps changing. */
			html [class*="z-[9500]"] {
				display: none;
			}

			/* The controls product-demo-main.tsx makes inert should not advertise a
			   press either. Keep this list in step with the one there. */
			html [aria-label="Open settings"],
			html [aria-label="Dictate"],
			html [title="View archived sessions"],
			html a[href^="/pr/"] {
				cursor: default;
			}

			/* The Desk trigger. It floats over the transcript waiting to be
			   pressed, which is one affordance too many in a screenshot. */
			html [aria-label="Open the Desk"] {
				display: none;
			}

			.sidebar-independent-section:has(.sidebar-people-row) {
				display: none;
			}

			/* The demo runs one repo, so the per-row repo tile the inbox puts in
			   front of every title says the same word six times. */
			.sidebar-container .repo-tile {
				display: none;
			}

			/* The iPhone's status bar, for the phone shot the landing page frames.
			   The band itself is not drawn here: the capture hands the page a real
			   `safe-area-inset-top`, so the app's own phone header reserves the room
			   exactly as it does on a device. This only fills that reserved band
			   with what a phone puts in it. It is inside the app rather than
			   painted on the picture afterwards, so the clock takes the app's own
			   ink and follows the theme.

			   Phone widths only, which on this page means the poster capture: the
			   landing page always lays its preview out at desktop width. */
			.demo-status-bar {
				display: none;
			}

			@media (max-width: 720px) {
				.demo-status-bar {
					position: fixed;
					z-index: 40;
					top: 0;
					right: 0;
					left: 0;
					display: flex;
					align-items: center;
					justify-content: space-between;
					/* The band the capture reserved, so the bar can never disagree
					   with the header that stepped aside for it. */
					height: env(safe-area-inset-top, 0px);
					/* A device's own ears: the clock sits left of the island, the
					   indicators right of it. */
					padding: 0 22px 0 26px;
					color: var(--text);
					pointer-events: none;
				}

				/* 17pt semibold on a 393pt device, carried to this layout at the
				   same zoom as everything else in the shot. */
				.demo-status-bar time {
					font-size: 15px;
					font-weight: 600;
					letter-spacing: 0.01em;
					font-variant-numeric: tabular-nums;
				}

				.demo-status-icons {
					display: flex;
					align-items: center;
					gap: 5px;
				}

				.demo-status-icons svg {
					display: block;
				}
			}

			/* The Mac window's traffic lights. `html.wco` already reserves the
			   room for them at the start of this row. */
			html.wco .sidebar-brand {
				position: relative;
			}

			html.wco .sidebar-brand::before {
				content: "";
				position: absolute;
				z-index: 3;
				top: 50%;
				left: 20px;
				width: 12px;
				height: 12px;
				margin-top: -6px;
				border-radius: 50%;
				background: #ff5f57;
				box-shadow: 20px 0 #febc2e, 40px 0 #28c840;
				pointer-events: none;
			}
		</style>
		<title>Open Session product preview</title>
	</head>
	<body>
		<div id="root"></div>
		<div class="demo-status-bar" aria-hidden="true">
			<time>9:41</time>
			<span class="demo-status-icons">
				<!-- Cellular: four bars, all full. -->
				<svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor">
					<rect x="0" y="7.5" width="3" height="3.5" rx="1" />
					<rect x="4.6" y="5.5" width="3" height="5.5" rx="1" />
					<rect x="9.2" y="3" width="3" height="8" rx="1" />
					<rect x="13.8" y="0" width="3" height="11" rx="1" />
				</svg>
				<!-- Wi-Fi: three arcs and the dot. -->
				<svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-linecap="round">
					<path d="M1.1 3.5a9.2 9.2 0 0 1 12.8 0" stroke-width="1.9" />
					<path d="M3.6 6.2a5.7 5.7 0 0 1 7.8 0" stroke-width="1.9" />
					<path d="M6.1 8.9a2.1 2.1 0 0 1 2.8 0" stroke-width="1.9" />
				</svg>
				<!-- Battery: shell, cap, and a full charge. -->
				<svg width="25" height="12" viewBox="0 0 25 12" fill="none">
					<rect x="0.6" y="0.6" width="21" height="10.8" rx="3.2" stroke="currentColor" stroke-opacity="0.38" stroke-width="1.1" />
					<path d="M23.1 4.3v3.4a1.9 1.9 0 0 0 0-3.4Z" fill="currentColor" fill-opacity="0.38" />
					<rect x="2.2" y="2.2" width="17.8" height="7.6" rx="2" fill="currentColor" />
				</svg>
			</span>
		</div>
		<script type="module" src="./product-demo-main.tsx"></script>
	</body>
</html>
