<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light" />
		<link rel="stylesheet" href="../src/frontend/styles/base.css" />
		<link rel="stylesheet" href="../src/frontend/styles/legacy.css" />
		<link rel="stylesheet" href="./.demo-tailwind.css" />
		<style>
			.sidebar-independent-section:has(.sidebar-people-row) {
				display: none;
			}

			@media (min-width: 721px) {
				.sidebar-brand {
					border-bottom: 1px solid var(--top-divider);
				}
			}

			/* The Mac window's traffic lights. `html.wco` already reserves the
			   room for them at the start of this row. */
			html.wco .sidebar-brand {
				position: relative;
			}

			html.wco .sidebar-brand::before {
				content: "";
				position: absolute;
				z-index: 3;
				top: 50%;
				left: 20px;
				width: 12px;
				height: 12px;
				margin-top: -6px;
				border-radius: 50%;
				background: #ff5f57;
				box-shadow: 20px 0 #febc2e, 40px 0 #28c840;
				pointer-events: none;
			}
		</style>
		<title>Open Session product preview</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="./product-demo-main.tsx"></script>
	</body>
</html>
