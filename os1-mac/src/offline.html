<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Open Session</title>
    <style>
      /* The app's own tokens, copied rather than linked: this page loads from
         file:// exactly when the server is unreachable, so it cannot pull the
         app's stylesheet. Keep in sync with src/frontend/styles/base.css and
         tailwind.css. The page gradient and the 76px mark are the splash in
         src/frontend/index.html, so a launch that stalls resolves onto the
         surface it was already showing instead of cutting to a black slab. */
      :root {
        color-scheme: dark;
        --page: radial-gradient(120% 90% at 50% 35%, #262626 0%, #1b1b1b 70%);
        --bg: #1c1c1c;
        --text: #e9e9e9;
        --text-dim: #a2a2a2;
        --text-faint: #767676;
        --accent: var(--text);
        --on-accent: var(--bg);
        --accent-hover: color-mix(in srgb, var(--accent) 86%, var(--bg));
        --title-weight: 500;
        --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
        --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
        /* The radius multiplier and corner shape base.css flips together: a
           superellipse hugs the corner tighter than an arc, so a browser that
           can draw one carries the larger radius, and a browser without
           `corner-shape` takes the 1.75x smaller circular corner that cuts the
           same amount off. This page only ever renders in Electron, which has
           corner-shape, so the fallback is here to stay in step with base.css
           rather than because anything draws it. */
        --rf: 0.771;
        --cs: round;
      }
      /* The shell cannot read the app's stored theme (its own origin), so it
         follows the system, which is what the app's System setting does. */
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --page: radial-gradient(120% 90% at 50% 35%, #ffffff 0%, #f3f1ee 70%);
          --bg: #ffffff;
          --text: #1a1a1a;
          --text-dim: #646464;
          --text-faint: #949494;
          --title-weight: 600;
        }
      }
      @supports (corner-shape: squircle) {
        :root {
          --rf: 1.35;
          --cs: squircle;
        }
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--page);
        color: var(--text);
        font: 15px/1.5 var(--sans);
        -webkit-font-smoothing: antialiased;
        -webkit-user-select: none;
        -webkit-app-region: drag;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 24px;
        text-align: center;
        -webkit-app-region: no-drag;
      }
      .mark {
        display: block;
        width: 76px;
        height: 76px;
      }
      h1 {
        margin: 20px 0 0;
        font-size: 24px;
        font-weight: var(--title-weight);
        letter-spacing: -0.01em;
      }
      .message {
        margin: 8px 0 0;
        max-width: 46ch;
        line-height: 1.375;
        color: var(--text-dim);
      }
      .host {
        margin: 10px 0 0;
        font-family: var(--mono);
        font-size: 13px;
        color: var(--text-faint);
      }
      /* The Button primitive's `primary` at `lg`: an ink plate with the
         top-down sheen that keeps a solid fill from reading as printed. */
      .retry {
        margin-top: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        padding: 0 14px;
        border: 1px solid transparent;
        border-radius: calc(12px * var(--rf));
        corner-shape: var(--cs);
        background-color: var(--accent);
        background-image: linear-gradient(
          to bottom,
          transparent,
          rgb(255 255 255 / 0.035) 35%,
          rgb(255 255 255 / 0.01) 55%,
          rgb(0 0 0 / 0.05)
        );
        box-shadow:
          0 1px 2px -1px rgb(0 0 0 / 0.05),
          0 2px 5px -3px rgb(0 0 0 / 0.07);
        color: var(--on-accent);
        font: 500 15px/1 var(--sans);
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          scale 0.15s ease;
      }
      .retry:hover {
        background-color: var(--accent-hover);
      }
      .retry:active {
        scale: 0.96;
      }
      .retry:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #status {
        margin: 14px 0 0;
        min-height: 1.2em;
        font-size: 11px;
        color: var(--text-faint);
      }
      @media (prefers-reduced-motion: reduce) {
        .retry {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="mark.png" width="76" height="76" alt="" />
      <h1 id="title">Can’t reach Open Session</h1>
      <p class="message" id="message">
        The server isn’t responding. Check your network connection.
      </p>
      <p class="host" id="host"></p>
      <button class="retry" id="retry" onclick="retry()">Try again</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const APP_URL = params.get("url") || "http://127.0.0.1:3850/";
      const status = document.getElementById("status");

      // Which server it is trying: the shell takes it from OS1_URL or its
      // packaged default, so the person cannot see it anywhere else.
      try {
        document.getElementById("host").textContent = new URL(APP_URL).host;
      } catch {}

      let attempt = 0;
      async function probe() {
        attempt++;
        status.textContent = "Retrying automatically · attempt " + attempt;
        try {
          await fetch(APP_URL, { method: "HEAD", mode: "no-cors" });
          location.href = APP_URL;
        } catch {}
      }
      function retry() {
        location.href = APP_URL;
      }
      probe();
      setInterval(probe, 5000);
    </script>
  </body>
</html>
