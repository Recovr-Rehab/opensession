<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Open Session</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0b0809;
        color: #e8e4e2;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-user-select: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-app-region: drag;
      }
      main {
        text-align: center;
        max-width: 26em;
        -webkit-app-region: no-drag;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        color: #9b9492;
        margin: 0 0 20px;
      }
      button {
        background: #e8e4e2;
        color: #0b0809;
        border: 0;
        border-radius: 6px;
        padding: 8px 18px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      #status {
        margin-top: 14px;
        font-size: 13px;
        color: #6f6866;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Can’t reach Open Session</h1>
      <p id="message">
        The configured Open Session server is unavailable. Check your network
        connection and server settings, then retry.
      </p>
      <button id="retry" onclick="retry()">Retry</button>
      <div id="status"></div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const APP_URL = params.get("url") || "http://127.0.0.1:3850/";
      const retryButton = document.getElementById("retry");
      const status = document.getElementById("status");

      let attempt = 0;
      async function probe() {
        attempt++;
        status.textContent = "Retrying automatically… (attempt " + attempt + ")";
        try {
          await fetch(APP_URL, { method: "HEAD", mode: "no-cors" });
          location.href = APP_URL;
        } catch {}
      }
      function retry() {
        location.href = APP_URL;
      }
      probe();
      setInterval(probe, 5000);
    </script>
  </body>
</html>
