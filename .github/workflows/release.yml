# Publish the release artefacts the default install downloads.
#
# `install.sh` with no flags fetches
#   https://github.com/tellahq/opensession/releases/latest/download/opensession-<os>-<arch>.tar.gz
# so every release carries, beside its versioned tarballs, one stable alias per
# target. scripts/build-compile.ts cross-compiles per target (bun --target, nothing executes target
# binaries), so one Linux runner builds all four. Pi is bundled into the binary,
# so there is no engine seed to prebuild.
#
# GitHub's immutable releases lock their tag and assets at publication. This
# workflow therefore owns the full order: create or reuse a draft, upload every
# asset, verify the draft, then publish it. Push a tag to start a release, or
# create a draft in the GitHub UI and dispatch this workflow before publishing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true

permissions:
  contents: write

jobs:
  artefacts:
    name: Build and upload
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Prepare release draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$is_draft" != "true" ]; then
              echo "::error title=Release is already immutable::$TAG is already published. Create the next release as a draft, or push only its tag and let this workflow publish it."
              exit 1
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build artefacts
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          mkdir -p "$out/assets"
          for target in linux/x64 linux/arm64 darwin/x64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            # The default artefact is the compiled single-executable
            # (build-compile.ts, cross-compiled per target). The source install
            # path is a git checkout, so no tarball is published for it.
            bun scripts/build-compile.ts --os "$os" --arch "$arch" --out "$out"
            versioned="$(ls "$out"/opensession-*-"$os"-"$arch".tar.gz)"
            cp "$versioned" "$out/assets/"
            cp "$versioned" "$out/assets/opensession-$os-$arch.tar.gz"
          done
          ls -la "$out/assets"
      - name: Upload and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release/assets"
          gh release upload "$TAG" "$assets"/* --clobber

          find "$assets" -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/expected-assets"
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/uploaded-assets"
          if ! diff -u "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/uploaded-assets"; then
            echo "::error title=Release assets are incomplete::The draft asset set does not match the build output."
            exit 1
          fi

          gh release edit "$TAG" --draft=false --latest
